[package]
name = "super-simple-chat-native"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.5.5", default-features = false, features = ["api-4-5"] }
mlua = { version = "0.11", features = ["luau", "vendored", "send", "serialize"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
opus = "0.3"
libmpv2-sys = "4.0.1"
libc = "0.2"
httparse = "1"
hickory-resolver = "0.26.3"
url = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
