[package]
name = "super-simple-chat-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
libc = "0.2"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
rusqlite = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.9"
subtle = "2"
rusty_enet = "0.4.1"
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "std"] }
opus = "0.3"
zip = { version = "4", default-features = false, features = ["deflate"] }
mlua = { version = "0.11", features = ["luau", "vendored", "send", "serialize"] }

[dev-dependencies]
tempfile = "3"
